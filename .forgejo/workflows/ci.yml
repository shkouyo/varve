# Full-duty CI pipeline.
# Triggered on push to main (publish tag: latest), on tags
# (publish tag: SemVer), and manually via workflow_dispatch. Runs on
# a github-runner (container-mode runner, Ubuntu 24.04 job container).

name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch: {}

jobs:
  # Stage 1: Go tests and builds.
  test:
    name: Go test and build
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install Go 1.26 toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Version must match the //go:generate directive in internal/web;
      # bump both together. tailwindcss 4.x ships its CLI as the separate
      # @tailwindcss/cli package: installing `tailwindcss` alone creates no
      # executable, so install both into the checkout's node_modules.
      - name: Install tailwindcss CLI
        run: npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3

      # Pre-compiles internal/web/static/app.css (embed.FS); must run
      # before any step that compiles Go, because the file is gitignored
      # and absent from the checkout. node_modules/.bin is not on the
      # runner PATH and GITHUB_PATH persistence is unreliable across
      # runner versions and modes, so prepend it here in this step's own
      # shell: the export reaches go generate in the same process.
      - name: Generate embedded assets
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          go generate ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build binaries
        run: |
          # A multi-package `go build` does not emit binaries, so build
          # each command separately; both outputs land in the repo root
          # (matching the upload path below).
          go build ./cmd/varve
          go build ./cmd/varve-worker

      # upload-artifact/download-artifact v4+ cannot run on Forgejo: their
      # @actions/artifact v2+ client throws GHESNotSupportedError whenever
      # GITHUB_SERVER_URL is not github.com, rejecting any non-GitHub.com
      # server (including Forgejo instances) before a request is made.
      # v3 speaks the v1 artifact protocol (ACTIONS_RUNTIME_URL) that the
      # Forgejo server implements, and forgejo-runner still executes node16
      # actions; keep these pinned to v3, do not bump back to v4+.
      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: varve-binaries
          path: |
            varve
            varve-worker

  # Stage 2: Web standards compliance. Raw templates are linted with
  # html-validate; W3C Nu and axe-core validate real rendered pages, so
  # this job starts the controller with sample data and captures the
  # server output before running the checkers.
  web-quality:
    name: Web standards compliance
    needs: test
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
          # html5validator (W3C Nu) needs a JRE. The apt chromium packages
          # are snap transition stubs on Ubuntu 24.04 and cannot run inside
          # the job container, so Chrome is installed separately as Chrome
          # for Testing (see the Install Chrome for Testing step below).
          # html-validate is pinned: the templates are linted against a
          # fixed checker version, and unpinned "latest" installs drift.
          npm install -g html-validate@11.6.2 @axe-core/cli
          pip3 install --break-system-packages html5validator

      - name: html-validate
        run: html-validate "internal/web/templates/**/*.html"

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      # The v1 artifact protocol spoken by the v3 actions stores files
      # without their Unix mode bits, so the downloaded binaries arrive
      # non-executable; restore the exec bit before running them.
      - name: Restore binary exec bits
        run: chmod +x varve varve-worker

      - name: Render sample pages
        run: |
          set -euo pipefail
          # Start the controller with a minimal configuration and sample
          # repository data, then capture every rendered page for the
          # checkers below. Artifacts need not exist on disk: the index is
          # rebuilt by the product's own rebuild-index subcommand.
          ROOT=/tmp/varve-web-quality
          PAGES="$ROOT/pages"
          WORK="$ROOT/work"
          CONF="$ROOT/varve.toml"
          API=127.0.0.1:33759
          WEB=127.0.0.1:33760
          AUTH="admin:sim-admin-pass"

          rm -rf "$ROOT"
          mkdir -p "$WORK/repo" "$WORK/logs" "$PAGES"

          # Minimal valid controller configuration (config validation rules).
          cat > "$CONF" <<EOF
          [server]
          api_listen = "$API"
          web_listen = "$WEB"

          [api]
          token = "sim-token"

          [database]
          path = "$WORK/varve.db"

          [storage]
          backend = "local"

          [storage.local]
          root = "$WORK/repo"

          [repo]
          name = "simrepo"
          sign = "off"

          [source]
          url = "file://$WORK/empty-source"
          poll_interval = "24h"

          [web]
          download_enabled = true
          download_base_uri = "https://repo.example.invalid/varve"
          [[web.admins]]
          user = "admin"
          password = "sim-admin-pass"

          [logs]
          dir = "$WORK/logs"
          EOF
          chmod 600 "$CONF" # the file carries a password

          # Sample repository records (repo.Sidecar TOML layout).
          cat > "$WORK/repo/hello.meta.toml" <<'EOF'
          pkgbase = "hello"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "hello-2.12.1-1-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "hello"
          version = "2.12.1-1"
          arch = "x86_64"
          size = 104448
          sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          [build]
          commit = "deadbeef0123456789abcdef0123456789abcdef"
          upstream_ref = ""
          srcinfo_hash = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
          time = 2026-01-15T10:00:00Z
          worker = "builder-1"
          EOF
          cat > "$WORK/repo/zlib.meta.toml" <<'EOF'
          pkgbase = "zlib"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "zlib-1.3.1-2-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "zlib"
          version = "1.3.1-2"
          arch = "x86_64"
          size = 188416
          sha256 = "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"

          [build]
          commit = "cafebabe0123456789abcdef0123456789abcdef"
          upstream_ref = ""
          srcinfo_hash = "1111111111111111111111111111111111111111111111111111111111111111"
          time = 2026-01-16T11:30:00Z
          worker = "builder-2"
          EOF
          cat > "$WORK/repo/gcc.meta.toml" <<'EOF'
          pkgbase = "gcc"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "gcc-14.2.1-2-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "gcc"
          version = "14.2.1-2"
          arch = "x86_64"
          size = 67829760
          sha256 = "2222222222222222222222222222222222222222222222222222222222222222"

          [build]
          commit = "0123456789abcdef0123456789abcdef0123456789"
          upstream_ref = ""
          srcinfo_hash = "3333333333333333333333333333333333333333333333333333333333333333"
          time = 2026-01-17T09:00:00Z
          worker = "builder-1"
          EOF

          # Rebuild the SQLite index from the side files. Build ids are
          # generated 16-hex strings, so read the real ids back from the
          # database (hello, zlib, gcc in seq order) instead of assuming
          # numeric ids.
          "$PWD/varve" rebuild-index --config "$CONF"

          mapfile -t IDS < <(python3 - "$WORK/varve.db" <<'PYEOF'
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          try:
              rows = con.execute("SELECT id FROM builds ORDER BY seq").fetchall()
          finally:
              con.close()
          print("\n".join(r[0] for r in rows))
          PYEOF
          )
          ID1=${IDS[0]}
          ID2=${IDS[1]}
          ID3=${IDS[2]}
          echo "build ids: hello=$ID1 zlib=$ID2 gcc=$ID3"

          # Build logs: hello and zlib have logs; gcc (build 3) has none,
          # so the no-log branch of the build page is covered too.
          printf '==> hello: checking build env\n==> make -j8\n==> packaging\n' > "$WORK/logs/$ID1.log"
          printf '==> zlib: ./configure --prefix=/usr\n==> make -j8\n==> packaging\n' > "$WORK/logs/$ID2.log"

          # Give the hello build two resource samples so the progress-bar
          # markup (CPU/memory/disk) renders and gets checked.
          python3 - "$WORK/varve.db" "$ID1" <<'PYEOF'
          import json, sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          samples = [
              {"at": "2026-01-15T10:00:00.000000000Z", "cpu_time_ns": 0, "memory_bytes": 52428800,
               "disk_total_bytes": 107374182400, "disk_available_bytes": 75161927680, "disk_used_bytes": 32212254720},
              {"at": "2026-01-15T10:00:05.000000000Z", "cpu_time_ns": 2500000000, "memory_bytes": 56623104,
               "disk_total_bytes": 107374182400, "disk_available_bytes": 74000000000, "disk_used_bytes": 33374182400},
          ]
          try:
              con.execute("UPDATE builds SET resource_usage = ? WHERE id = ?",
                          (json.dumps(samples), sys.argv[2]))
              con.commit()
          finally:
              con.close()
          PYEOF

          # Start the controller (default serve subcommand) and wait for
          # the web port; the trap stops it on failure as well.
          "$PWD/varve" --config "$CONF" > "$ROOT/serve.log" 2>&1 &
          SRV=$!
          trap 'kill -TERM "$SRV" 2>/dev/null || true; wait "$SRV" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "$WEB/"; then ready=1; break; fi
            sleep 0.5
          done
          [ "$ready" = 1 ] || { cat "$ROOT/serve.log"; exit 1; }

          # Save every rendered page; admin routes need Basic Auth (-u is
          # ignored on public routes). The authenticated dashboard carries
          # the admin content, and the 404 page is saved too: it is a
          # valid error-template render.
          fetch() { # <url> <file> [expected status]
            code=$(curl -s -u "$AUTH" -o "$PAGES/$2" -w '%{http_code}' "$1")
            [ "$code" = "${3:-200}" ] || { echo "unexpected status $code for $1 (want ${3:-200})" >&2; return 1; }
          }
          fetch "$WEB/"                          index.html
          fetch "$WEB/packages"                  packages.html
          fetch "$WEB/packages/hello"            package-hello.html
          fetch "$WEB/builds"                    builds.html
          fetch "$WEB/builds/$ID1"               build-hello.html
          fetch "$WEB/builds/$ID2"               build-zlib.html
          fetch "$WEB/builds/$ID3"               build-gcc.html
          fetch "$WEB/admin/builds"              admin-builds.html
          fetch "$WEB/packages/__nope__"         404.html 404

          # Graceful shutdown (SIGTERM); the trap above is the backstop.
          kill -TERM "$SRV"
          wait "$SRV" 2>/dev/null || true
          trap - EXIT

      # The rendered pages inline the compiled Tailwind v4 stylesheet. The
      # W3C Nu CSS engine does not know its modern at-rules (@layer,
      # @property) and flags them as CSS errors; only those CSS-scoped
      # messages are ignored, so any genuine HTML structure error still
      # fails the step.
      - name: W3C Nu HTML Checker
        run: html5validator --root /tmp/varve-web-quality/pages --skip-non-html --ignore-re "CSS:"

      # Ubuntu 24.04 (the job container base) ships chromium as a snap
      # transition package: the apt packages only install stub scripts that
      # exec /snap/bin/chromium, which does not exist inside the container,
      # so Chrome dies on launch ("Server terminated early with status 1").
      # Chrome for Testing is a standalone build that needs no snap; the
      # last-known-good endpoint publishes a chromedriver of the exact same
      # version, so browser and driver always match. The apt packages below
      # are the shared libraries the CfT Chrome binary links against.
      - name: Install Chrome for Testing
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libatspi2.0-0t64 libcairo2 libpango-1.0-0 \
            libx11-6 libxcb1 libxext6 libxi6 libxtst6 libxss1 libglib2.0-0 \
            libdbus-1-3 libgtk-3-0t64 fonts-liberation
          CFT=/opt/chrome-for-testing
          rm -rf "$CFT"
          mkdir -p "$CFT"
          python3 - <<'PYEOF'
          import json, os, urllib.request, zipfile

          DATA_URL = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          DEST = "/opt/chrome-for-testing"
          data = json.load(urllib.request.urlopen(DATA_URL, timeout=60))
          stable = data["channels"]["Stable"]
          for kind in ("chrome", "chromedriver"):
              url = next(e["url"] for e in stable["downloads"][kind] if e["platform"] == "linux64")
              archive = os.path.join(DEST, f"{kind}.zip")
              urllib.request.urlretrieve(url, archive)
              with zipfile.ZipFile(archive) as z:
                  z.extractall(DEST)
              os.remove(archive)
          PYEOF
          # The CfT archives do not preserve the exec bit on every helper
          # binary (e.g. chrome_crashpad_handler), without which Chrome
          # aborts at launch; make the whole tree executable.
          chmod -R a+x "$CFT"
          "$CFT/chrome-linux64/chrome" --version

      # Run against the saved pages (no external resources, CSS inline, so
      # file:// works). Chrome runs as root in the job container, which
      # requires the no-sandbox flag, and disable-dev-shm-usage keeps Chrome
      # away from the container's small /dev/shm.
      - name: axe-core audit (headless browser)
        run: |
          CHROME=/opt/chrome-for-testing/chrome-linux64/chrome
          CHROMEDRIVER=/opt/chrome-for-testing/chromedriver-linux64/chromedriver
          for page in /tmp/varve-web-quality/pages/*.html; do
            npx @axe-core/cli "file://$page" --chrome-path "$CHROME" \
              --chromedriver-path "$CHROMEDRIVER" \
              --chrome-options "no-sandbox,disable-dev-shm-usage" --exit || exit 1
          done

  # Stage 3: build both container images from the stage 1 binaries.
  # The runner executes jobs inside a job container that has no docker
  # daemon socket (/var/run/docker.sock), so `docker build` cannot work.
  # Job containers also run without CAP_SYS_ADMIN, which makes buildah
  # unusable: it re-execs itself into a new user namespace to gain the
  # mount privileges its RUN steps need, and the runner's seccomp policy
  # blocks that (unshare(CLONE_NEWUSER) -> EPERM). The kaniko executor
  # needs no daemon and no user or mount namespaces at all, so it runs
  # unmodified in the job container.
  build-images:
    name: Build container images
    needs: test
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      # The v1 artifact protocol spoken by the v3 actions stores files
      # without their Unix mode bits. The Containerfile COPY steps keep
      # the source mode, so without this the images would ship
      # non-executable binaries.
      - name: Restore binary exec bits
        run: chmod +x varve varve-worker

      # kaniko resolves the short base-image name (archlinux/archlinux)
      # to docker.io itself; no registries configuration is needed.
      # Pin the executor tag: gcr.io/kaniko-project/executor:v1.24.0.
      - name: Build controller image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.controller
            --no-push

      - name: Build worker image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.worker
            --no-push

  # Stage 4: publish images to Forgejo Packages (container registry).
  # main -> latest; tag -> SemVer tag (e.g. 0.1.0). The registry requires
  # the Forgejo image naming convention {registry}/{owner}/{image}, where
  # the registry is the instance host (e.g. git.0x0f.dev) and the owner is
  # the repository owner namespace (github.repository_owner). The registry
  # host is derived from the instance server URL unless the optional
  # PACKAGES_REGISTRY secret overrides it (needed only when the registry is
  # not served on the instance host).
  # Credentials: the Actions GITHUB_TOKEN cannot push packages: it
  # authenticates as the special forgejo-actions user, for which package
  # write access is not implemented, and the workflow `permissions` key is
  # ignored by Forgejo. Configure the PACKAGES_TOKEN secret with a
  # personal access token scoped to write:package, owned by the triggering
  # user (github.actor).
  # Like Stage 3, this job runs in a job container without a docker
  # daemon, so it uses the kaniko executor (a docker:// action) for the
  # build and push steps; the token is written to a Docker config file in
  # the shared workspace and consumed via DOCKER_CONFIG, so it never
  # appears on a command line or in logs.
  publish:
    name: Publish to Forgejo Packages
    needs: build-images
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      # The v1 artifact protocol spoken by the v3 actions stores files
      # without their Unix mode bits. The Containerfile COPY steps keep
      # the source mode, so without this the images would ship
      # non-executable binaries.
      - name: Restore binary exec bits
        run: chmod +x varve varve-worker

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Resolve the registry host: an explicit PACKAGES_REGISTRY secret wins,
      # otherwise derive the instance host from the server URL (stripping
      # the scheme). GITHUB_SERVER_URL is the instance URL, e.g.
      # https://git.0x0f.dev -> git.0x0f.dev.
      - name: Resolve registry
        id: registry
        env:
          PACKAGES_REGISTRY: ${{ secrets.PACKAGES_REGISTRY }}
        run: |
          set -euo pipefail
          registry="${PACKAGES_REGISTRY:-}"
          if [ -z "$registry" ]; then
            registry="$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^https?://##; s#/$##')"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # kaniko reads registry credentials from a Docker config file
      # (DOCKER_CONFIG). Write it into the shared workspace so the kaniko
      # action containers can see it, and generate a .dockerignore that
      # keeps it out of the build context. The token itself never appears
      # on a command line or in logs. The config host must match the push
      # destination host exactly; both come from the same step output above.
      - name: Configure registry credentials
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' \
            "${{ github.actor }}" "${{ secrets.PACKAGES_TOKEN }}" \
            | base64 -w0)"
          mkdir -p "$GITHUB_WORKSPACE/.docker"
          chmod 700 "$GITHUB_WORKSPACE/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
            "${{ steps.registry.outputs.registry }}" "$auth" \
            > "$GITHUB_WORKSPACE/.docker/config.json"
          chmod 600 "$GITHUB_WORKSPACE/.docker/config.json"
          printf '.docker\n' > "$GITHUB_WORKSPACE/.dockerignore"

      - name: Build and push controller image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.controller
            --destination=${{ steps.registry.outputs.registry }}/${{ github.repository_owner }}/varve-controller:${{ steps.tag.outputs.tag }}

      - name: Build and push worker image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.worker
            --destination=${{ steps.registry.outputs.registry }}/${{ github.repository_owner }}/varve-worker:${{ steps.tag.outputs.tag }}
