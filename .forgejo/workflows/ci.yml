# Full-duty CI pipeline.
# Triggered on push to main (publish tag: latest), on tags
# (publish tag: SemVer), and manually via workflow_dispatch. Runs on
# a github-runner (Ubuntu host-mode runner, same environment as
# GitHub Actions).

name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch: {}

jobs:
  # Stage 1: Go tests and builds.
  test:
    name: Go test and build
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install Go 1.26 toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Version must match the //go:generate directive in internal/web;
      # bump both together. tailwindcss 4.x ships its CLI as the separate
      # @tailwindcss/cli package: installing `tailwindcss` alone creates no
      # executable, so install both into the checkout's node_modules.
      - name: Install tailwindcss CLI
        run: npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3

      # Pre-compiles internal/web/static/app.css (embed.FS); must run
      # before any step that compiles Go, because the file is gitignored
      # and absent from the checkout. node_modules/.bin is not on the
      # runner PATH and GITHUB_PATH persistence is unreliable across
      # runner versions and modes, so prepend it here in this step's own
      # shell: the export reaches go generate in the same process.
      - name: Generate embedded assets
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          go generate ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build binaries
        run: |
          # A multi-package `go build` does not emit binaries, so build
          # each command separately; both outputs land in the repo root
          # (matching the upload path below).
          go build ./cmd/varve
          go build ./cmd/varve-worker

      # upload-artifact/download-artifact v4+ cannot run on Forgejo: their
      # @actions/artifact v2+ client throws GHESNotSupportedError whenever
      # GITHUB_SERVER_URL is not github.com, rejecting any non-GitHub.com
      # server (including Forgejo instances) before a request is made.
      # v3 speaks the v1 artifact protocol (ACTIONS_RUNTIME_URL) that the
      # Forgejo server implements, and forgejo-runner still executes node16
      # actions; keep these pinned to v3, do not bump back to v4+.
      - name: Upload binaries
        uses: actions/upload-artifact@v3
        with:
          name: varve-binaries
          path: |
            varve
            varve-worker

  # Stage 2: Web standards compliance. Raw templates are linted with
  # html-validate; W3C Nu and axe-core validate real rendered pages, so
  # this job starts the controller with sample data and captures the
  # server output before running the checkers.
  web-quality:
    name: Web standards compliance
    needs: test
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless chromium
          # @axe-core/cli drives Chrome through chromedriver, which must
          # match the installed chromium build. The Ubuntu package name
          # changed between releases (chromium-chromedriver ->
          # chromium-driver); install whichever exists. If neither does,
          # the axe step falls back to the npm-bundled chromedriver.
          sudo apt-get install -y chromium-chromedriver || sudo apt-get install -y chromium-driver || true
          npm install -g html-validate @axe-core/cli
          pip3 install --break-system-packages html5validator

      - name: html-validate
        run: html-validate "internal/web/templates/**/*.html"

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      - name: Render sample pages
        run: |
          set -euo pipefail
          # Start the controller with a minimal configuration and sample
          # repository data, then capture every rendered page for the
          # checkers below. Artifacts need not exist on disk: the index is
          # rebuilt by the product's own rebuild-index subcommand.
          ROOT=/tmp/varve-web-quality
          PAGES="$ROOT/pages"
          WORK="$ROOT/work"
          CONF="$ROOT/varve.toml"
          API=127.0.0.1:33759
          WEB=127.0.0.1:33760
          AUTH="admin:sim-admin-pass"

          rm -rf "$ROOT"
          mkdir -p "$WORK/repo" "$WORK/logs" "$PAGES"

          # Minimal valid controller configuration (config validation rules).
          cat > "$CONF" <<EOF
          [server]
          api_listen = "$API"
          web_listen = "$WEB"

          [api]
          token = "sim-token"

          [database]
          path = "$WORK/varve.db"

          [storage]
          backend = "local"

          [storage.local]
          root = "$WORK/repo"

          [repo]
          name = "simrepo"
          sign = "off"

          [source]
          url = "file://$WORK/empty-source"
          poll_interval = "24h"

          [web]
          download_enabled = true
          download_base_uri = "https://repo.example.invalid/varve"
          admin_user = "admin"
          admin_password = "sim-admin-pass"

          [logs]
          dir = "$WORK/logs"
          EOF
          chmod 600 "$CONF" # the file carries a password

          # Sample repository records (repo.Sidecar TOML layout).
          cat > "$WORK/repo/hello.meta.toml" <<'EOF'
          pkgbase = "hello"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "hello-2.12.1-1-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "hello"
          version = "2.12.1-1"
          arch = "x86_64"
          size = 104448
          sha256 = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          [build]
          commit = "deadbeef0123456789abcdef0123456789abcdef"
          upstream_ref = ""
          srcinfo_hash = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
          time = 2026-01-15T10:00:00Z
          worker = "builder-1"
          EOF
          cat > "$WORK/repo/zlib.meta.toml" <<'EOF'
          pkgbase = "zlib"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "zlib-1.3.1-2-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "zlib"
          version = "1.3.1-2"
          arch = "x86_64"
          size = 188416
          sha256 = "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"

          [build]
          commit = "cafebabe0123456789abcdef0123456789abcdef"
          upstream_ref = ""
          srcinfo_hash = "1111111111111111111111111111111111111111111111111111111111111111"
          time = 2026-01-16T11:30:00Z
          worker = "builder-2"
          EOF
          cat > "$WORK/repo/gcc.meta.toml" <<'EOF'
          pkgbase = "gcc"
          branch = "main"
          vcs = ""

          [[artifacts]]
          file = "gcc-14.2.1-2-x86_64.pkg.tar.zst"
          kind = "package"
          pkgname = "gcc"
          version = "14.2.1-2"
          arch = "x86_64"
          size = 67829760
          sha256 = "2222222222222222222222222222222222222222222222222222222222222222"

          [build]
          commit = "0123456789abcdef0123456789abcdef0123456789"
          upstream_ref = ""
          srcinfo_hash = "3333333333333333333333333333333333333333333333333333333333333333"
          time = 2026-01-17T09:00:00Z
          worker = "builder-1"
          EOF

          # Build logs: builds 1 and 2 have logs; gcc (build 3) has none,
          # so the missing-log error page is covered too.
          printf '==> hello: checking build env\n==> make -j8\n==> packaging\n' > "$WORK/logs/1.log"
          printf '==> zlib: ./configure --prefix=/usr\n==> make -j8\n==> packaging\n' > "$WORK/logs/2.log"

          # Rebuild the SQLite index from the side files.
          "$PWD/varve" rebuild-index --config "$CONF"

          # Start the controller (default serve subcommand) and wait for
          # the web port; the trap stops it on failure as well.
          "$PWD/varve" --config "$CONF" > "$ROOT/serve.log" 2>&1 &
          SRV=$!
          trap 'kill -TERM "$SRV" 2>/dev/null || true; wait "$SRV" 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null "$WEB/"; then ready=1; break; fi
            sleep 0.5
          done
          [ "$ready" = 1 ] || { cat "$ROOT/serve.log"; exit 1; }

          # Save every rendered page; admin routes need Basic Auth (-u is
          # ignored on public routes). The 404 pages are saved too: they
          # are valid error-template renders.
          fetch() { # <url> <file> [expected status]
            code=$(curl -s -u "$AUTH" -o "$PAGES/$2" -w '%{http_code}' "$1")
            [ "$code" = "${3:-200}" ] || { echo "unexpected status $code for $1" >&2; return 1; }
          }
          fetch "$WEB/"                          index.html
          fetch "$WEB/packages"                  packages.html
          fetch "$WEB/packages/hello"            package-hello.html
          fetch "$WEB/builds/1"                  build-1.html
          fetch "$WEB/builds/1/log"              build-1-log.html
          fetch "$WEB/builds/3"                  build-3.html
          fetch "$WEB/builds/3/log"              build-3-log.html 404
          fetch "$WEB/admin"                     admin.html
          fetch "$WEB/admin/builds?failed=1"     admin-builds.html
          fetch "$WEB/packages/__nope__"         404.html 404

          # Graceful shutdown (SIGTERM); the trap above is the backstop.
          kill -TERM "$SRV"
          wait "$SRV" 2>/dev/null || true
          trap - EXIT

      # The rendered pages inline the compiled Tailwind v4 stylesheet. The
      # W3C Nu CSS engine does not know its modern at-rules (@layer,
      # @property) and flags them as CSS errors; only those CSS-scoped
      # messages are ignored, so any genuine HTML structure error still
      # fails the step.
      - name: W3C Nu HTML Checker
        run: html5validator --root /tmp/varve-web-quality/pages --skip-non-html --ignore-re "CSS:"

      # Run against the saved pages (no external resources, CSS inline, so
      # file:// works). Prefer a system chromedriver that matches the apt
      # chromium; otherwise let @axe-core/cli use its npm-bundled driver.
      - name: axe-core audit (headless browser)
        run: |
          CHROMEDRIVER="$(command -v chromedriver 2>/dev/null || true)"
          for page in /tmp/varve-web-quality/pages/*.html; do
            if [ -n "$CHROMEDRIVER" ]; then
              npx @axe-core/cli "file://$page" --chrome-path /usr/bin/chromium \
                --chromedriver-path "$CHROMEDRIVER" --exit || exit 1
            else
              npx @axe-core/cli "file://$page" --chrome-path /usr/bin/chromium \
                --exit || exit 1
            fi
          done

  # Stage 3: build both container images from the stage 1 binaries.
  # The runner executes jobs inside a job container that has no docker
  # daemon socket (/var/run/docker.sock), so `docker build` cannot work.
  # Build with buildah instead: it needs no daemon, and combined with the
  # vfs storage driver plus chroot isolation it does not even require a
  # privileged container (verified: default oci isolation needs mount
  # permissions that unprivileged job containers do not have).
  build-images:
    name: Build container images
    needs: test
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      # buildah on Ubuntu ships no unqualified-search registries, and the
      # Containerfiles pull `archlinux/archlinux` by short name; point
      # buildah at docker.io or the first build step fails to resolve it.
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah ca-certificates
          printf 'unqualified-search-registries = ["docker.io"]\n' \
            | sudo tee /etc/containers/registries.conf >/dev/null

      - name: Build controller image
        run: >-
          buildah --storage-driver=vfs bud --isolation=chroot
          -f Containerfile.controller -t varve-controller:ci .

      - name: Build worker image
        run: >-
          buildah --storage-driver=vfs bud --isolation=chroot
          -f Containerfile.worker -t varve-worker:ci .

  # Stage 4: publish images to Forgejo Packages (container registry).
  # main -> latest; tag -> SemVer tag (e.g. 0.1.0).
  # Image names varve-controller / varve-worker (final form follows the
  # Forgejo Packages naming convention for this instance).
  # Credentials: configure FORGEJO_PACKAGES_TOKEN (package write
  # permission) and FORGEJO_REGISTRY (e.g. git.0x0f.dev) in the Forgejo
  # Secrets of this repository.
  # Like Stage 3, this job runs in a job container without a docker
  # daemon, so it uses buildah (vfs storage + chroot isolation) for the
  # build and push steps; the token is fed to `buildah login` via
  # --password-stdin so it never appears on a command line or in logs.
  publish:
    name: Publish to Forgejo Packages
    needs: build-images
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      # v3, not v4+: v4+ fails on Forgejo with GHESNotSupportedError
      # (see the Upload binaries step for the rationale).
      - uses: actions/download-artifact@v3
        with:
          name: varve-binaries
          path: .

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # buildah on Ubuntu ships no unqualified-search registries, and the
      # Containerfiles pull `archlinux/archlinux` by short name; point
      # buildah at docker.io or the build steps fail to resolve it.
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah ca-certificates
          printf 'unqualified-search-registries = ["docker.io"]\n' \
            | sudo tee /etc/containers/registries.conf >/dev/null

      - name: Login to registry
        run: |
          echo "${{ secrets.FORGEJO_PACKAGES_TOKEN }}" \
            | buildah login -u "${{ github.actor }}" \
              --password-stdin "${{ secrets.FORGEJO_REGISTRY }}"

      - name: Build and push controller image
        run: |
          image="${{ secrets.FORGEJO_REGISTRY }}/varve-controller:${{ steps.tag.outputs.tag }}"
          buildah --storage-driver=vfs bud --isolation=chroot \
            -f Containerfile.controller -t "$image" .
          buildah --storage-driver=vfs push "$image"

      - name: Build and push worker image
        run: |
          image="${{ secrets.FORGEJO_REGISTRY }}/varve-worker:${{ steps.tag.outputs.tag }}"
          buildah --storage-driver=vfs bud --isolation=chroot \
            -f Containerfile.worker -t "$image" .
          buildah --storage-driver=vfs push "$image"
