# Manual release workflow: build both binaries and publish the container
# images to Forgejo Packages. Triggered only from the Actions UI via
# workflow_dispatch with an optional tag input. No tests, vet, lint or
# format checks run here: this workflow is the publish path, validation
# already happened before the operator decided to release.
#
# The runner executes jobs inside a job container that has no docker
# daemon socket (/var/run/docker.sock), so `docker build` cannot work.
# Job containers also run without CAP_SYS_ADMIN, which makes buildah
# unusable: it re-execs itself into a new user namespace to gain the
# mount privileges its RUN steps need, and the runner's seccomp policy
# blocks that (unshare(CLONE_NEWUSER) -> EPERM). The kaniko executor
# needs no daemon and no user or mount namespaces at all, so it runs
# unmodified in the job container.
#
# Credentials: the Actions GITHUB_TOKEN cannot push packages: it
# authenticates as the special forgejo-actions user, for which package
# write access is not implemented, and the workflow `permissions` key is
# ignored by Forgejo. Configure the PACKAGES_TOKEN secret with a
# personal access token scoped to write:package, owned by the triggering
# user (github.actor). The token is written to a Docker config file in
# the shared workspace and consumed via DOCKER_CONFIG, so it never
# appears on a command line or in logs.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag to publish (default latest)
        default: latest
        required: false

jobs:
  build-and-publish:
    name: Build and publish images
    runs-on: github-runner
    steps:
      - uses: actions/checkout@v7

      - name: Install Go 1.26 toolchain
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # The controller embeds internal/web/static/app.css (embed.FS); the
      # file is generated by go generate and gitignored, so it is absent
      # from the checkout and compiling varve without it fails. tailwindcss
      # 4.x ships its CLI as the separate @tailwindcss/cli package:
      # installing `tailwindcss` alone creates no executable, so install
      # both into the checkout's node_modules.
      - name: Install tailwindcss CLI
        run: npm install --no-save tailwindcss@4.3.3 @tailwindcss/cli@4.3.3

      - name: Generate embedded assets
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          go generate ./...

      # A multi-package `go build` does not emit binaries, so build each
      # command separately; both outputs land in the repo root, matching
      # the COPY paths in the Containerfiles. The Containerfile COPY steps
      # keep the source mode, so the exec bit must be set here.
      - name: Build binaries
        run: |
          go build ./cmd/varve
          go build ./cmd/varve-worker
          chmod +x varve varve-worker

      # Resolve the registry host: an explicit PACKAGES_REGISTRY secret
      # wins, otherwise derive the instance host from the server URL
      # (stripping the scheme). GITHUB_SERVER_URL is the instance URL,
      # e.g. https://git.0x0f.dev -> git.0x0f.dev.
      - name: Resolve registry
        id: registry
        env:
          PACKAGES_REGISTRY: ${{ secrets.PACKAGES_REGISTRY }}
        run: |
          set -euo pipefail
          registry="${PACKAGES_REGISTRY:-}"
          if [ -z "$registry" ]; then
            registry="$(printf '%s' "$GITHUB_SERVER_URL" | sed -E 's#^https?://##; s#/$##')"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      # kaniko reads registry credentials from a Docker config file
      # (DOCKER_CONFIG). Write it into the shared workspace so the kaniko
      # action containers can see it, and generate a .dockerignore that
      # keeps it out of the build context. The token itself never appears
      # on a command line or in logs. The config host must match the push
      # destination host exactly; both come from the same step output above.
      - name: Configure registry credentials
        run: |
          set -euo pipefail
          auth="$(printf '%s:%s' \
            "${{ github.actor }}" "${{ secrets.PACKAGES_TOKEN }}" \
            | base64 -w0)"
          mkdir -p "$GITHUB_WORKSPACE/.docker"
          chmod 700 "$GITHUB_WORKSPACE/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' \
            "${{ steps.registry.outputs.registry }}" "$auth" \
            > "$GITHUB_WORKSPACE/.docker/config.json"
          chmod 600 "$GITHUB_WORKSPACE/.docker/config.json"
          printf '.docker\n' > "$GITHUB_WORKSPACE/.dockerignore"

      - name: Build and push controller image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.controller
            --destination=${{ steps.registry.outputs.registry }}/${{ github.repository_owner }}/varve-controller:${{ inputs.tag || 'latest' }}

      - name: Build and push worker image
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: |
            --context=${{ github.workspace }}
            --dockerfile=Containerfile.worker
            --destination=${{ steps.registry.outputs.registry }}/${{ github.repository_owner }}/varve-worker:${{ inputs.tag || 'latest' }}
