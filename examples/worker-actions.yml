# examples/worker-actions.yml
name: varve-worker
on:
    workflow_dispatch:
jobs:
    worker:
        runs-on: ubuntu-latest
        container:
            image: <registry>/varve-worker:latest # Forgejo Packages 发布的镜像
            env:
                VARVE_CONTROLLER_URL: ${{ secrets.VARVE_CONTROLLER_URL }}
                VARVE_TOKEN: ${{ secrets.VARVE_TOKEN }}
                VARVE_ROLE: agent # 容器内以 agent 身份运行 (pool 模式)
                # VARVE_WORKER_NAME: runner-1 # 可选: 手动指定节点名, 否则自动生成
        steps:
            - run: varve-worker
