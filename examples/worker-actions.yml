# examples/worker-actions.yml
name: varve-worker
on:
    workflow_dispatch:
jobs:
    worker:
        runs-on: ubuntu-latest
        container:
            image: <registry>/varve-worker:latest # image published to Forgejo Packages
            env:
                VARVE_CONTROLLER_URL: ${{ secrets.VARVE_CONTROLLER_URL }}
                VARVE_TOKEN: ${{ secrets.VARVE_TOKEN }}
                VARVE_ROLE: agent # run as an agent inside the container (pool mode)
                # VARVE_WORKER_NAME: runner-1 # optional: fixed node name; auto-generated when unset
        steps:
            - run: varve-worker
