# .varve.toml — per-branch build configuration
#
# Drop this file into the root of a source branch (next to PKGBUILD and
# .SRCINFO) to configure how varve builds it. Every branch is one package:
# the branch name is the package key, the PKGBUILD in the branch root is
# what gets built.
#
# All keys below are optional. A branch without a .varve.toml builds as a
# plain PKGBUILD branch. Unknown keys are ignored, so newer controller
# versions can extend the format without breaking older dotfiles.
#
# Multiple files may be combined with the "extras" list: every referenced
# file is merged into the main one (maintainers and hooks append, scalar
# settings are overridden by the later file).

# Maintainers receive failure notifications (and AUR push failures) and are
# shown on the package page. Each entry must carry both a name and an
# email address. Older dotfiles may still use the plain string-list form
# ("maintainers = [\"a@example.org\"]"), which is accepted as email-only
# entries.
[[maintainers]]
name = "Alice Example"
email = "alice@example.org"

[[maintainers]]
name = "Bob Example"
email = "bob@example.org"

# The version control kind of the upstream source: "auto" (detect from the
# package name suffix -git/-svn), "git", "svn" or "none" (default "auto").
vcs = "auto"

# [pkgbuild_source] — build from an external PKGBUILD repository instead
# of the branch tree. The branch only declares the package metadata; the
# actual PKGBUILD and .SRCINFO are read from url (optional subdirectory and
# branch). Omit the whole section to build the branch tree itself.
# [pkgbuild_source]
# url = "git@git.example.org:pkgs/foo.git"
# branch = "master"
# directory = "packages/foo"

# [collect] — artifact collection rules for the build result.
[collect]
# Exclude artifacts whose name matches any of these globs (the ".pkg.tar"
# parts stay attached, e.g. "*-debug.pkg.tar.zst").
exclude = ["*-debug"]

# [hooks] — scripts executed inside the build container. Each list holds
# repository-relative paths (or shell commands starting with a "/"); they
# run through "/bin/sh -e" in the container's PKGBUILD working directory.
[hooks]
# pre_build: right before makepkg starts.
# pre_build = ["scripts/prepare.sh"]
# post_build: after makepkg finishes, before artifact collection.
# post_build = ["scripts/strip-debug.sh"]
# on_success: after a successful build (artifact checksums already done).
# on_success = ["scripts/notify.sh"]
# on_failure: after a failed build, in the container still holding the
# working directory.
# on_failure = ["scripts/collect-log.sh"]

# [aur] — publish the branch to the Arch User Repository. The controller
# must enable AUR publishing globally (an [aur] key_file in the controller
# configuration) or this section is inert.
[aur]
# The AUR package name the branch is published as (required for publish).
name = "my-aur-package"
# Push every successful build of this branch to the AUR package as its
# master history (default false). Each successful build is force-pushed to
# the AUR package, replacing its master history with the branch (the AUR
# package is treated as a mirror of the branch).
submit = true
