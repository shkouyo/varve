# /data/varve.toml
# Complete example configuration for the varve controller (the management
# machine), in flat style (no indentation) so it is easy to edit.
# Secrets are written directly in this file: keep its permissions at 0600.
# Some fields can be overridden by an environment variable of the same
# name: api.token, storage.s3 access_key/secret_key, source.fetch_key.

[server]
api_listen = ":31759" # worker API listen address (default ":31759"; used only by workers)
web_listen = ":31760" # Web UI listen address (default ":31760"; public pages plus /admin)
web_url = "https://varve.example.org" # public Web UI URL; used only for build-log links in mails, independent of download_base_uri

[api]
token = "change-me" # shared Bearer Token; overridable via VARVE_API_TOKEN (required, empty fails validation)
token_file = "" # optional: read the token from a file instead (e.g. a mounted container secret); precedence: token_file > TOML value, below environment variable

[database]
path = "/data/varve.db" # SQLite database path (default "/data/varve.db")

[storage]
backend = "local" # artifact storage backend (default "local"; "local" | "s3")

[storage.local]
root = "/data/repo" # local backend repository root (default "/data/repo"; flat repo files plus the staging/ upload area)

[storage.s3]
endpoint = "https://s3.example.org" # S3-compatible endpoint URL
bucket = "varve-repo" # bucket root holding flat repo files; the staging/ prefix is the upload area
region = "us-east-1" # S3 region
access_key = "" # access key; overridable via VARVE_S3_ACCESS_KEY
secret_key = "" # secret key; overridable via VARVE_S3_SECRET_KEY
path_style = true # use path-style addressing (usually required for MinIO and similar; default true)

[repo]
name = "varve" # repository name (default "varve"); produces <name>.db.tar.gz / <name>.files.tar.gz
work_dir = "/data/work" # repo-add working directory (default "/data/work"; used only with the S3 backend, on the controller machine)
sign = "off" # signing mode (default "off"; "off" | "packages" | "packages+db")
keep_versions = 1 # versions kept per package (default 1; currently only 1 = latest is supported)

[gpg]
key_id = "" # signing key ID (required when sign != "off"; at least one of key_id/key_file)
key_file = "" # optional: armored private key file (kept long-term on the controller)
passphrase = "" # private key passphrase; written directly in this file, so file permissions must be 0600

[source]
url = "git@git.example.org:pkgbuilds.git" # source repository URL (required; each branch is one package)
fetch_key = "" # optional: SSH private key path or token (for private source repos); overridable via VARVE_SOURCE_FETCH_KEY
poll_interval = "5m" # change-detection polling interval (default "5m")
exclude_branches = ["main", "wip/*"] # branches excluded from polling (default excludes main)

[worker]
heartbeat_timeout = "90s" # a worker is marked offline after this many seconds without a heartbeat (default "90s")
stall_timeout = "10m" # a task without progress for this long is reclaimed and reassigned (default "10m")
build_timeout = "30m" # maximum duration of a single build task (default "30m")
cpu_limit = 0 # container CPU limit (default 0 = unlimited; e.g. 4)
memory_limit = 0 # container memory limit (default 0 = unlimited; e.g. "8GiB")
retry_max = 3 # a failed task is retried up to this many times (default 3; 0 disables retries)
failed_rebuild_cooldown = "1h" # minimum wait before a failed package is rebuilt again (default "1h")

#packager = "Your Name <you@example.org>" # build identity injected as PACKAGER into every build environment (default empty = not injected; format "Name <email>")

[worker.actions]
enabled = false # dispatch one workflow run per queued task (default false)
token = "" # GitHub PAT with actions:write permission on the runner repo; written directly in this file, so file permissions must be 0600
repo = "" # repository of the runner workflow, e.g. "owner/runner-repo"; required when enabled
workflow = "worker-actions.yml" # workflow file to dispatch (default "worker-actions.yml"); must declare the task_id/task_token inputs
ref = "main" # git ref to dispatch on (default "main")
max_concurrency = 3 # maximum concurrent runner runs (default 3; must be greater than zero)
claim_timeout = "5m" # a dispatched run must claim its task within this window or the task is re-dispatched (default "5m")

[mail]
enabled = false # failure notifications (default false; only sent when a build fails)
host = "" # SMTP server address
port = 587 # SMTP port (default 587)
username = "" # SMTP username
password = "" # SMTP password; written directly in this file, so file permissions must be 0600
from = "varve@example.org" # sender address (default "varve@example.org")
tls = "starttls" # TLS mode (default "starttls"; "none" | "starttls" | "implicit")

[aur]
server = "aur.archlinux.org" # AUR SSH server (default "aur.archlinux.org")
key_file = "" # SSH private key used to push branch commits to AUR package repos; mount it under /data; empty disables AUR publishing
user = "aur" # SSH user (default "aur")

[web]
download_enabled = true # show download buttons (default true); when true, download_base_uri below is required
download_base_uri = "https://downloads.example.org/varve" # direct-link URI prefix (e.g. a CDN or public bucket); required when download_enabled is true
recent_builds = 20 # how many recent builds the dashboard shows (default 20; must be greater than zero)

[[web.admins]]
user = "admin" # one Basic Auth account guarding /admin; at least one entry is required, users must be unique
password = "change-me" # account password (required); written directly in this file, so file permissions must be 0600

# Add another account with a second [[web.admins]] block.

[logs]
dir = "/data/logs" # build log directory (default "/data/logs")
retention = "90d" # retention of successful build logs (default "90d"; rolling)
max_builds = 1000 # maximum number of successful logs kept (default 1000; rolling)
# Failed build logs are kept forever, regardless of the settings above.
