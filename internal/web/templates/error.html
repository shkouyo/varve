<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Status}}: {{.Title}}·Varve</title>
  <style>{{.CSS}}</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-neutral-950 dark:text-neutral-100">
  <a class="skip-link" href="#main">Skip to main content</a>
  {{template "header" .}}

  <main id="main" class="mx-auto max-w-6xl px-4 py-16">
    <div class="mx-auto max-w-xl rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-white/10 dark:bg-neutral-900">
      <p class="mb-2 text-6xl font-bold tracking-tight text-slate-500 dark:text-neutral-400">{{.Status}}</p>
      <h1 class="mb-2 text-2xl font-bold tracking-tight">{{.Title}}</h1>
      <p class="text-slate-600 dark:text-neutral-300">{{.Message}}</p>
      <p class="mt-6">
        <a class="rounded-lg bg-purple-700 px-4 py-2 text-sm font-semibold text-white hover:bg-purple-800 dark:bg-purple-600 dark:hover:bg-purple-500" href="/">Back to overview</a>
      </p>
    </div>
  </main>

  {{template "footer" .}}
</body>
</html>
