  <header class="border-b border-stone-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center gap-1 px-4 py-3" aria-label="Main">
      <a href="/" class="mr-4 flex items-center gap-2 rounded-lg text-lg font-bold tracking-tight text-stone-900">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-blue-700" aria-hidden="true" focusable="false">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>

        varve

      <a href="/packages" class="rounded-lg px-3 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900">Packages</a>
      <a href="/admin" class="rounded-lg px-3 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900">Admin</a>

  <main id="main" class="mx-auto max-w-6xl px-4 py-16">
    <div class="mx-auto max-w-xl rounded-xl border border-stone-200 bg-white p-8 text-center shadow-sm">
      <p class="mb-2 text-6xl font-bold tracking-tight text-stone-500">{{.Status}}</p>
      <h1 class="mb-2 text-2xl font-bold tracking-tight">{{.Title}}</h1>
      <p class="text-stone-600">{{.Message}}</p>
      <p class="mt-6">
        <a class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800" href="/">Back to dashboard</a>
      </p>

  </main>

  <footer class="border-t border-stone-200 py-6">
    <p class="mx-auto max-w-6xl px-4 text-sm text-stone-600">varve — AUR-style package build farm. Metrics are shown as text only; no charts, no external resources.</p>
