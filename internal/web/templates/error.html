<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Status}}: {{.Title}}·Varve</title>
  <!-- No-JavaScript fallback: without script support the page
       re-fetches itself on the refresh cadence; the <noscript> wrapper
       keeps JavaScript users (and axe) from seeing a timed refresh
       (WCAG 2.2.1), and pages that must never refresh (terminal builds,
       error pages) render nothing at all. -->
  <noscript>{{if .PageActive}}<meta http-equiv="refresh" content="{{.RefreshSeconds}}">{{end}}</noscript>
  <style>{{.CSS}}</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-1 gap-y-2 px-4 py-3" aria-label="Main">
      <a href="/" class="mr-4 flex items-center gap-2 rounded-lg text-lg font-bold tracking-tight text-slate-900 dark:text-slate-100">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-blue-700 dark:text-blue-400" aria-hidden="true" focusable="false">
          <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Varve
      </a>
      <a href="/" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">Overview</a>
      <a href="/packages" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">Packages</a>
      <a href="/builds" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100">Builds</a>
      <div class="ml-auto flex items-center gap-2">
        {{if .LoggedIn}}
        <span class="px-2 text-sm font-medium text-slate-600 dark:text-slate-300">{{.User}}</span>
        <a class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100" href="/admin/logout">Logout</a>
        {{else}}
        <a class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100" href="/admin">Login</a>
        {{end}}
      </div>
    </nav>
  </header>

  <main id="main" class="mx-auto max-w-6xl px-4 py-16">
    <div class="mx-auto max-w-xl rounded-xl border border-slate-200 bg-white p-8 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <p class="mb-2 text-6xl font-bold tracking-tight text-slate-500 dark:text-slate-400">{{.Status}}</p>
      <h1 class="mb-2 text-2xl font-bold tracking-tight">{{.Title}}</h1>
      <p class="text-slate-600 dark:text-slate-400">{{.Message}}</p>
      <p class="mt-6">
        <a class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800 dark:bg-blue-600 dark:hover:bg-blue-500" href="/">Back to overview</a>
      </p>
    </div>
  </main>

  <footer class="border-t border-slate-200 py-6 dark:border-slate-800">
    <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-2 px-4 text-sm text-slate-600 dark:text-slate-400" aria-label="Footer">
      <a class="underline underline-offset-2 hover:text-slate-900 dark:hover:text-slate-200" href="/COPYING.txt">License: AGPL-3.0-or-later</a>
      <a class="underline underline-offset-2 hover:text-slate-900 dark:hover:text-slate-200" href="https://git.0x0f.dev/shkouyo/varve" target="_blank" rel="noopener noreferrer">Source code</a>
    </nav>
  </footer>
  {{if .PageActive}}<script>
    (function () {
      "use strict";
      // Auto-refresh for JavaScript users on the same cadence the
      // <noscript> meta refresh gives no-JavaScript users; the reload is
      // skipped while the tab is hidden, so background tabs stay quiet.
      // Pages that must never refresh (terminal builds, error pages)
      // carry RefreshSeconds = 0 and skip the timer entirely.
      var seconds = {{.RefreshSeconds}};
      if (seconds > 0) {
        setInterval(function () {
          if (document.visibilityState === "visible") {
            location.reload();
          }
        }, seconds * 1000);
      }
    })();
  </script>{{end}}
</body>
</html>
