{{define "header"}}
<header class="border-b border-slate-200 bg-white dark:border-white/10 dark:bg-neutral-900">
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-1 gap-y-2 px-4 py-3" aria-label="Main">
    <a class="mr-4 flex items-center gap-2 rounded-lg text-lg font-bold tracking-tight text-slate-900 dark:text-neutral-100"
       href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-blue-700 dark:text-blue-400" aria-hidden="true" focusable="false">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
      Varve
    </a>
    <a class="rounded-lg px-3 py-2 text-sm font-medium {{if eq .Nav "dashboard"}}bg-blue-50 text-blue-800 dark:bg-blue-950 dark:text-blue-300{{else}}text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100{{end}}"
       href="/" {{if eq .Nav "dashboard"}}aria-current="page"{{end}}>Overview</a>
    <a class="rounded-lg px-3 py-2 text-sm font-medium {{if eq .Nav "packages"}}bg-blue-50 text-blue-800 dark:bg-blue-950 dark:text-blue-300{{else}}text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100{{end}}"
       href="/packages" {{if eq .Nav "packages"}}aria-current="page"{{end}}>Packages</a>
    <a class="rounded-lg px-3 py-2 text-sm font-medium {{if eq .Nav "builds"}}bg-blue-50 text-blue-800 dark:bg-blue-950 dark:text-blue-300{{else}}text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100{{end}}"
       href="/builds" {{if eq .Nav "builds"}}aria-current="page"{{end}}>Builds</a>
    <div class="ml-auto flex items-center gap-2">
      {{if .LoggedIn}}
      <span class="px-2 text-sm font-medium text-slate-600 dark:text-neutral-300">{{.User}}</span>
      <a class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100"
         href="/admin/logout">Logout</a>
      {{else}}
      <a class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100" href="/admin">Login</a>
      {{end}}
    </div>
  </nav>
</header>
{{end}}
{{define "footer"}}
<footer class="border-t border-slate-200 py-6 dark:border-white/10">
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-4 gap-y-2 px-4 text-sm text-slate-600 dark:text-neutral-400" aria-label="Footer">
    <ul class="flex flex-wrap items-center gap-x-4 gap-y-2">
      <li>
        <a class="underline underline-offset-2 hover:text-slate-900 dark:hover:text-neutral-100" href="https://git.0x0f.dev/shkouyo/varve" target="_blank" rel="noopener noreferrer">Powered by Varve</a><span aria-hidden="true"> | </span>Render: {{.RenderTime}}
      </li>
    </ul>
    <ul class="flex flex-wrap items-center gap-x-4 gap-y-2">
      <li><a class="underline underline-offset-2 hover:text-slate-900 dark:hover:text-neutral-100" href="/COPYING.txt">License: AGPL-3.0-or-later</a></li>
    </ul>
  </nav>
</footer>
{{end}}
{{define "statusBadge"}}{{buildBadge .}}{{end}}
